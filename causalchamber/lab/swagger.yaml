        it ends, the unused part is refunded (see Credits).

        The quote is for the experiment, not the account: it doesn't check
        whether the user's queue is full or their wallet can pay, which
        may change before they submit it. A tag in the body is ignored.

        Checks, in order (the first that fails determines the response),
        the same as POST /v1/experiments up to the queue's limits:
          1. The body is JSON (415, or 400 if malformed) and a non-empty
             object (400).
          2. The fields instructions, chamber_id and chamber_config are
             present, in that order (400), and chamber_id and
             chamber_config are strings (400).
          3. The chamber exists and the user may use it (403).
          4. The chamber is in queue mode (422).
          5. chamber_config is one of the chamber's configurations (400).
          6. The instructions are a string or a list of strings, and valid
             (400).
          7. The protocol is within the queue's limits: number of
             instructions, then WAIT durations and MSR delays, then number of
             measurements (422).
