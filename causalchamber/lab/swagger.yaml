  /v1/experiments:
    get:
      summary: List the user's experiments
      description: |
        Returns the latest experiments submitted by this user, on any
        chamber, newest first (by submitted_on, then experiment_id, both
        descending): at most `limit`. With `active_only=true`, only the
        experiments not finished yet (QUEUED, SUBMITTING, RUNNING or
        STOPPING); the limit then applies to those. A user with no (active)
        experiments gets an empty list.

        Checks, in order: limit is valid (400), active_only
        is valid (400).
      parameters:
        - name: limit
          in: query
          required: false
          description: >
            The maximum number of experiments to return (the latest ones):
            an integer between 1 and 100. Default 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: active_only
          in: query
          required: false
          description: >
            If true, only the experiments not finished yet (QUEUED,
            SUBMITTING, RUNNING or STOPPING). "true" or "false", in any case.
            Default false.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The experiments
          content:
            application/json:
              schema:
                type: object
                properties:
                  experiments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Experiment'
                  scheduler_id:
                    $ref: '#/components/schemas/SchedulerId'
                required:
                  - experiments
                  - scheduler_id
              example:
                experiments:
                  - experiment_id: "c3d4e5f6-a7b8-4c5d-8e9f-0a1b2c3d4e5f"
                    chamber_id: "tt-test-virt"
                    chamber_config: "standard"
                    status: "RUNNING"
                    user_id: "user123"
                    tag: "pressure_test_1"
                    submitted_on: 1709856240.789
                    started_on: 1709856250.123
                    est_runtime_seconds: 1860.0
                    total_instructions: 1000
                    current_instruction: 498
                    download_url: null
                    checksum: null
                  - experiment_id: "a1b2c3d4-e5f6-4a5b-8c9d-0e1f2a3b4c5d"
